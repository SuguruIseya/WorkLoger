<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業記録">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>作業記録</title>
</head>
<body>
<header id="calendarHeader">
  <h1>作業記録</h1>
  <nav class="month-nav">
    <button id="backMonth" aria-label="前の月">‹</button>
    <strong id="monthLabel"></strong>
    <button id="nextMonth" aria-label="次の月">›</button>
  </nav>
</header>

<main>
  <section id="calendarView" class="view">
    <div class="calendar" id="calendar"></div>
    <div class="total-label"><span>月間合計</span><small id="monthConfirmed"></small></div>
      <strong id="monthTotal">¥0</strong>
    </div>
    <button class="secondary" id="settingsBtn">設定</button>
  </section>

  <section id="dayView" class="view hidden">
    <button class="back" id="backToCalendar">← カレンダー</button>
    <h2 id="dayTitle"></h2>

    <div class="attendance">
      <label>出勤<input id="clockIn" type="time"></label>
      <label>退勤<input id="clockOut" type="time"></label>
    </div>

    <div class="day-grid" id="dayGrid"></div>

    <div class="daily-total">
      <div class="total-label"><span>本日の合計</span><small id="dayConfirmed"></small></div>
      <strong id="dayTotal">¥0</strong>
    </div>

    <section class="special-pay-section">
      <div class="section-heading">
        <h3>特別給</h3>
        <button class="small-button" id="addSpecialPay">＋ 追加</button>
      </div>
      <div id="specialPays"></div>
      <p class="note" id="specialPayNote">通常の時間給とは別に、臨時手当などを記録できます。</p>
    </section>

    <h3>作業ログ</h3>
    <div id="logs"></div>
    <button class="primary" id="addLog">＋ 作業ログを追加</button>
  </section>

  <section id="settingsView" class="view hidden">
    <button class="back" id="backFromSettings">← カレンダー</button>
    <h2>設定</h2>
    <p class="note">15分マスの計算は「時給 ÷ 4」です。「300円/h（仮定）」は作業したものの給金発生が未確定な場合に使います。</p>
    <div id="rateSettings"></div>
    <button class="primary" id="saveSettings">設定を保存</button>
    <hr>
    <button class="secondary" id="exportJson">JSONバックアップを書き出す</button>
    <button class="secondary" id="importJson">JSONバックアップを読み込む</button>
    <input type="file" id="jsonFile" accept=".json,application/json" hidden>
    <button class="secondary" id="exportCsv">CSVを書き出す</button>
  </section>
</main>

<div id="picker" class="modal hidden">
  <div class="modal-card">
    <h3 id="pickerTitle">作業種別</h3>
    <div id="typeButtons"></div>
    <button class="secondary" id="clearSlot">未入力にする</button>
    <button class="secondary" id="closePicker">キャンセル</button>
  </div>
</div>

<div id="specialPayModal" class="modal hidden">
  <div class="modal-card">
    <h3>特別給を追加</h3>
    <label class="modal-field">金額<input id="specialPayAmount" type="number" inputmode="numeric" step="1" min="0" placeholder="例：500"></label>
    <label class="modal-field">内容<input id="specialPayMemo" type="text" maxlength="80" placeholder="例：臨時手当"></label>
    <button class="primary" id="saveSpecialPay">追加する</button>
    <button class="secondary" id="closeSpecialPay">キャンセル</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
